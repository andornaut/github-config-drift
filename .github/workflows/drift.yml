name: Drift

# Weekly, and on a change to the canonical configs themselves, because editing
# canon is the moment every copy of it becomes stale.
#
# Reports rather than repairs: a repository can be behind canon or ahead of it,
# having reached a stricter position on its own, and only a reader can tell
# which. A failed run is the notification; the log holds the diff.
on:
  schedule:
    # Mondays, early enough that the week's first look at CI includes it.
    - cron: "0 7 * * 1"
  push:
    branches: [main]
    paths:
      - configs/**
      - check-drift.py
      - .github/workflows/drift.yml
  workflow_dispatch:

permissions:
  contents: read

# One at a time. A scheduled run and a push that lands while it is going would
# otherwise report the same drift twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  drift:
    name: Drift
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job reads a repository through git, so the
          # credential is not left in .git/config for a later step to use. The
          # step below reaches the API with a token it is handed directly.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      # Pinned in a manifest rather than installed by name, so a release cannot
      # turn this red on a commit that did not touch it.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Reads every repository's copy through the API rather than cloning them.
      # The default token reaches them because they are all public, and the
      # script lists them through the anonymous endpoint for the same reason: a
      # workflow token is not a user, so `user/repos` returns nothing for it.
      # The two failures are not the same news, and a red job alone cannot tell
      # them apart: 1 is drift to reconcile, 2 is a run that could not finish and
      # reported nothing, which says nothing about whether anything drifted.
      # Annotated so the distinction survives into the run summary, rather than
      # waiting for someone to open the log.
      - name: Check for drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Captured through `||` rather than after `&&`: this step runs under
        # `bash -e`, where a failing and-list ends the script before the status
        # can be read, and the annotation would never be written.
        run: |
          status=0
          python3 check-drift.py || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "::warning::the sweep could not be completed, so nothing was compared"
          else
            echo "::error::a config has drifted from configs/"
          fi
          exit "$status"
